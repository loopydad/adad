<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小熊对话屋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="bear-card" aria-label="可爱小熊">
      <div class="bear" role="img" aria-label="一只可爱的小熊">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="snout">
            <div class="nose"></div>
            <div class="mouth"></div>
          </div>
        </div>
      </div>
      <h1>小熊对话屋</h1>
      <p class="subtitle">这里只有一只很可爱的小熊，和它聊聊天吧～</p>
    </section>

    <section class="chat-card" aria-label="对话区域">
      <div id="chat-box" class="chat-box" aria-live="polite"></div>
      <form id="chat-form" class="input-row">
        <input
          id="user-input"
          type="text"
          placeholder="对小熊说点什么..."
          maxlength="120"
          required
        />
        <button type="submit">发送</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
